version: '3.8'

services:
  # ============ 基础设施 ============

  postgres:
    image: postgres:15-alpine
    container_name: kubeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kubeai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubeai123}
      POSTGRES_DB: ${POSTGRES_DB:-kubeai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kubeai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubeai-network

  redis:
    image: redis:7-alpine
    container_name: kubeai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubeai-network

  minio:
    image: minio/minio:latest
    container_name: kubeai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kubeai-network

  # MinIO 初始化（创建存储桶）
  minio-init:
    image: minio/mc:latest
    container_name: kubeai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-models}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb local/$${MINIO_BUCKET} --ignore-existing;
      echo 'MinIO bucket created successfully';
      exit 0;
      "
    networks:
      - kubeai-network

  etcd:
    image: bitnami/etcd:3.5
    container_name: kubeai-etcd
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    ports:
      - "${ETCD_PORT:-2379}:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kubeai-network

  # ============ 微服务 ============

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: kubeai-api-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-kubeai}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-kubeai123}
      - DB_NAME=${POSTGRES_DB:-kubeai}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - ETCD_HOSTS=etcd:2379
      - JWT_SECRET=${JWT_SECRET:-kubeai-jwt-secret}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    networks:
      - kubeai-network

  model-manager:
    build:
      context: ./model-manager
      dockerfile: Dockerfile
    container_name: kubeai-model-manager
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-kubeai}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-kubeai123}
      - DB_NAME=${POSTGRES_DB:-kubeai}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-ai-models}
      - MINIO_USE_SSL=false
      - ETCD_HOSTS=etcd:2379
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${MODEL_MANAGER_PORT:-58080}:58080"
    networks:
      - kubeai-network

  job-scheduler:
    build:
      context: ./job-scheduler
      dockerfile: Dockerfile
    container_name: kubeai-job-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-kubeai}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-kubeai123}
      - DB_NAME=${POSTGRES_DB:-kubeai}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - ETCD_HOSTS=etcd:2379
      - MODEL_MANAGER_URL=http://model-manager:58080
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${JOB_SCHEDULER_PORT:-58081}:58081"
    networks:
      - kubeai-network

  inference-gateway:
    build:
      context: ./inference-gateway
      dockerfile: Dockerfile
    container_name: kubeai-inference-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-kubeai}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-kubeai123}
      - DB_NAME=${POSTGRES_DB:-kubeai}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - ETCD_HOSTS=etcd:2379
      - MODEL_MANAGER_URL=http://model-manager:58080
      - JOB_SCHEDULER_URL=http://job-scheduler:58081
      - K8S_NAMESPACE=${K8S_NAMESPACE:-kubeai}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${INFERENCE_GATEWAY_PORT:-58082}:58082"
    networks:
      - kubeai-network

  # ============ 前端 ============

  frontend:
    build:
      context: ../kubeai-frontend
      dockerfile: Dockerfile
    container_name: kubeai-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      - API_BASE_URL=http://api-gateway:8080/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - kubeai-network

  # ============ 可观测性（可选） ============

  prometheus:
    image: prom/prometheus:latest
    container_name: kubeai-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - kubeai-network

  grafana:
    image: grafana/grafana:latest
    container_name: kubeai-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - kubeai-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  etcd_data:
  prometheus_data:
  grafana_data:

networks:
  kubeai-network:
    driver: bridge
